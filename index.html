<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Kids Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
body{height:100vh;background:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),url("https://images.unsplash.com/photo-1588072432836-e10032774350");background-size:cover;background-position:center;display:flex;justify-content:center;align-items:center;}
.login{width:90%;max-width:420px;background:rgba(255,255,255,0.25);backdrop-filter:blur(15px);border-radius:25px;padding:35px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.3);color:white;}
.title{font-size:30px;font-weight:900;}
.subtitle{margin-top:10px;margin-bottom:25px;}
input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;}
button{width:100%;padding:13px;margin-top:15px;border:none;border-radius:12px;font-size:16px;background:linear-gradient(45deg,#0f9b0f,#e52d27);color:white;cursor:pointer;}
.app{width:100%;height:100%;position:absolute;top:0;left:0;overflow:auto;padding:20px;display:none;background:linear-gradient(140deg,#0f9b0f,#ffffff,#e52d27);}
.header{text-align:center;font-size:24px;font-weight:900;margin-bottom:30px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
.icon{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.circle{width:85px;height:85px;border-radius:50%;background:rgba(255,255,255,0.35);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 10px 25px rgba(0,0,0,0.25);transition:0.3s;}
.circle:hover{transform:scale(1.15);}
.label{margin-top:8px;font-weight:bold;}

/* واجهة أيقونة الرصيد */
.balance-panel{
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%);
  width:220px;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:15px;
  margin-top:15px;
  box-shadow:0 8px 25px rgba(0,0,0,0.25);
  text-align:center;
  color:white;
  z-index:10;
  display:none;
}
.balance-panel input.email-input{
  width:90%;
  padding:8px;
  margin-bottom:10px;
  border-radius:8px;
  border:none;
  text-align:center;
}
.balance-panel button{
  padding:8px 15px;
  border:none;
  border-radius:10px;
  background:linear-gradient(45deg,#0f9b0f,#e52d27);
  color:white;
  cursor:pointer;
  margin-bottom:10px;
}
.balance-info{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  margin-top:10px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="title">Smart Kids Lab</div>
  <div class="subtitle">مختبر الشباب للذكاء والتعلم والإبداع</div>
  <input type="email" placeholder="البريد الإلكتروني">
  <input type="password" placeholder="كلمة المرور">
  <button onclick="enter()">دخول</button>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="header">Smart Kids Lab</div>
  <div class="grid">

    <div class="icon">
      <div class="circle">ℹ️</div>
      <div class="label">من نحن</div>
    </div>

    <div class="icon">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeNcS0aycr8_SgtEBGRz8UJfCY8Sth83oj8bBH_jZE_yV2aKA/viewform" target="_self" style="text-decoration:none;color:inherit;">
        <div class="circle">📝</div>
        <div class="label">انخرط</div>
      </a>
    </div>

    <div class="icon">
      <div class="circle">📚</div>
      <div class="label">تعلم</div>
    </div>

    <!-- أيقونة الرصيد -->
    <div class="icon" id="balanceIcon">
      <div class="circle">💰</div>
      <div class="label">رصيدك</div>

      <div class="balance-panel" id="balancePanel">
        <input type="email" placeholder="أدخل بريدك الإلكتروني" class="email-input" id="balanceEmail">
        <button onclick="loadBalance()">تسجيل الدخول</button>

        <div class="balance-info" id="balanceInfo" style="display:none;">
          <div class="profile-name" id="balanceName"></div>
          <div class="profile-points" id="balancePoints"></div>
          <div class="profile-balance" id="balanceValue"></div>
          <button onclick="closeBalance()">رجوع</button>
        </div>
      </div>
    </div>

    <div class="icon">
      <div class="circle">🎯</div>
      <div class="label">المهام</div>
    </div>

    <div class="icon">
      <div class="circle">🧠</div>
      <div class="label">اختبر مكتسباتك</div>
    </div>

    <div class="icon">
      <div class="circle">⭐</div>
      <div class="label">اجمع النقاط</div>
    </div>

    <div class="icon">
      <div class="circle">👥</div>
      <div class="label">المنخرطون</div>
    </div>

    <div class="icon">
      <div class="circle">🖼️</div>
      <div class="label">معرض الصور</div>
    </div>

    <div class="icon">
      <div class="circle">🔎</div>
      <div class="label">البحث</div>
    </div>

    <div class="icon">
      <div class="circle">🏆</div>
      <div class="label">جدول الترتيب</div>
    </div>

    <div class="icon">
      <div class="circle">🥇</div>
      <div class="label">تصنيفات وشارات</div>
    </div>

    <div class="icon">
      <div class="circle">📅</div>
      <div class="label">البرنامج العام</div>
    </div>

  </div>
</div>

<script>
function enter(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
}

// أيقونة الرصيد
const balanceIcon = document.getElementById("balanceIcon");
balanceIcon.addEventListener("click", function(e){
  if(e.target.closest("#balancePanel")) return;
  const panel = document.getElementById("balancePanel");
  panel.style.display = (panel.style.display === "none") ? "block" : "none";
});

function closeBalance(){
  document.getElementById("balancePanel").style.display = "none";
  document.getElementById("balanceInfo").style.display = "none";
  document.getElementById("balanceEmail").value = "";
}

function loadBalance(){
  let email = document.getElementById("balanceEmail").value.trim();
  if(!email){ alert("الرجاء إدخال البريد الإلكتروني."); return; }

  let webAppUrl = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; // ضع رابط Web App

  fetch(`${webAppUrl}?email=${encodeURIComponent(email)}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById("balanceName").innerText = data.name || "الاسم غير موجود";
      document.getElementById("balancePoints").innerText = `النقاط: ${data.points || 0}`;
      document.getElementById("balanceValue").innerText = `الرصيد: ${data.balance || 0} دج`;
      document.getElementById("balanceInfo").style.display = "flex";
    })
    .catch(err => alert("لم يتم العثور على بياناتك. تأكد من البريد الإلكتروني."));
}
</script>

</body>
</html>
