<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Kids Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
    body{height:100vh;background:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),url("https://images.unsplash.com/photo-1588072432836-e10032774350");background-size:cover;background-position:center;display:flex;justify-content:center;align-items:center;color:white;overflow:auto;}
    .login{width:90%;max-width:420px;background:rgba(255,255,255,0.25);backdrop-filter:blur(15px);border-radius:25px;padding:35px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.3);color:white;}
    .title{font-size:30px;font-weight:900;}.subtitle{margin-top:10px;margin-bottom:25px;}
    input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;}
    button{width:100%;padding:13px;margin-top:15px;border:none;border-radius:12px;font-size:16px;background:linear-gradient(45deg,#0f9b0f,#e52d27);color:white;cursor:pointer;}
    .app{width:100%;height:100%;position:absolute;top:0;left:0;overflow:auto;padding:20px;display:none;background:linear-gradient(to bottom,#0f9b0f,#ffffff,#e52d27);background-size:100% 400%;animation:bgMove 8s linear infinite;}
    @keyframes bgMove{0%{background-position:0% 0%;}50%{background-position:0% 100%;}100%{background-position:0% 0%;}}
    .header{text-align:center;font-size:24px;font-weight:900;margin-bottom:30px;}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
    .icon{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;}
    .circle{width:85px;height:85px;border-radius:50%;background:rgba(255,255,255,0.35);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 10px 25px rgba(0,0,0,0.25);transition:0.3s;}
    .label{margin-top:8px;font-weight:bold;}
    .digital-card{display:none;margin-top:15px;width:320px;border-radius:25px;background: rgba(255, 215, 0, 0.15);backdrop-filter: blur(18px);color: #0b3c5d;padding:25px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.5);transform: translateY(50px);opacity:0;transition: all 0.5s ease;position:absolute;left:50%;transform:translate(-50%,50px);z-index:9999;}
    .digital-card.show{display:block;transform:translate(-50%,0);opacity:1;}
    .card-info{display:none;flex-direction:column;gap:12px;background:#0b1f3b;padding:20px;border-radius:20px;color:#FFD700;font-weight:bold;}
    .points-counter{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);color:#FFD700;padding:8px 12px;border-radius:10px;font-weight:bold;z-index:9999;display:none;}
    #loadingBarContainer{position:fixed;bottom:0;left:0;width:100%;height:12px;background:#333;display:none;}
    #loadingBar{width:0%;height:100%;background:linear-gradient(90deg,#0f9b0f,#fff,#e52d27);transition:width 0.05s;}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="title">Smart Kids Lab</div>
  <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
  <input type="password" id="loginPassword" placeholder="كلمة المرور">
  <button onclick="enter()">دخول</button>
</div>

<div id="loadingBarContainer"><div id="loadingBar"></div></div>

<div class="app" id="app">
  <div class="header">Smart Kids Lab</div>
  <div class="grid">
    <div class="icon" id="balanceIcon"><div class="circle">💰</div><div class="label">رصيدك</div></div>
    <div class="icon" id="membersIcon"><div class="circle">👥</div><div class="label">المنخرطون</div></div>
  </div>
</div>

<div class="digital-card" id="digitalCard">
  <h3>💳 بطاقة رصيدك</h3>
  <div class="card-info" id="cardInfo">
    <div>الاسم: <span id="cardName"></span></div>
    <div>النقاط: <span id="cardPoints"></span></div>
    <button onclick="closeCard()">رجوع</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBWULfRuzxilJlC__ZJT54M-7dAq_7SnzA",
    authDomain: "smart-kids-lap-1ca13.firebaseapp.com",
    projectId: "smart-kids-lap-1ca13",
    storageBucket: "smart-kids-lap-1ca13.firebasestorage.app",
    messagingSenderId: "270026186495",
    appId: "1:270026186495:web:5ab677b0ee896d0c8076ca",
    measurementId: "G-203K24X70Y"
  };
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
</script>

<script>
  function showLoadingBar(callback){
    const bar=document.getElementById("loadingBar"); let width=0;
    bar.style.width="0%"; document.getElementById("loadingBarContainer").style.display="block";
    const interval=setInterval(()=>{width+=5; bar.style.width=width+"%"; if(width>=100){clearInterval(interval); document.getElementById("loadingBarContainer").style.display="none"; callback();}},30);
  }

  async function enter(){
    showLoadingBar(()=>{
      document.getElementById("login").style.display="none";
      document.getElementById("app").style.display="block";
    });
  }

  document.getElementById("balanceIcon").onclick = () => {
    document.getElementById("digitalCard").classList.add("show");
    document.getElementById("cardInfo").style.display="flex";
  };
  
  function closeCard(){ document.getElementById("digitalCard").classList.remove("show"); }
</script>
</body>
</html>
